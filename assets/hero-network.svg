<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of connected network nodes">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3FC7B0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3FC7B0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="420" height="420" fill="url(#glow)"/>

  <!-- connecting lines -->
  <g stroke="#2A5C56" stroke-width="1.4" fill="none">
    <line x1="210" y1="200" x2="90" y2="110"/>
    <line x1="210" y1="200" x2="330" y2="95"/>
    <line x1="210" y1="200" x2="70" y2="290"/>
    <line x1="210" y1="200" x2="320" y2="300"/>
    <line x1="210" y1="200" x2="210" y2="60"/>
    <line x1="90" y1="110" x2="70" y2="290"/>
    <line x1="330" y1="95" x2="320" y2="300"/>
    <line x1="70" y1="290" x2="320" y2="300"/>
    <line x1="90" y1="110" x2="210" y2="60"/>
    <line x1="330" y1="95" x2="210" y2="60"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="210" cy="200" r="9" fill="#3FC7B0"/>
    <circle cx="90" cy="110" r="6" fill="#8CA2B0"/>
    <circle cx="330" cy="95" r="6" fill="#8CA2B0"/>
    <circle cx="70" cy="290" r="6" fill="#8CA2B0"/>
    <circle cx="320" cy="300" r="6" fill="#8CA2B0"/>
    <circle cx="210" cy="60" r="6" fill="#E2A15C"/>
  </g>

  <!-- outer ring -->
  <circle cx="210" cy="200" r="170" stroke="#23343F" stroke-width="1" fill="none"/>
</svg>
